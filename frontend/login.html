<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrisisSense AI — Tactical Duty Access</title>

    <link rel="stylesheet" href="login.css">
    <script type="module" src="login.js"></script>
</head>
<body>

    <!-- Subtle Decent Background -->
    <div class="login-bg-mesh" aria-hidden="true">
        <div class="bg-orb orb-1"></div>
        <div class="bg-orb orb-2"></div>
    </div>

    <div class="login-container">

        <!-- Logo -->
        <div class="brand-badge">
            <span class="brand-dot"></span>
            <span class="brand-text">CrisisSense AI</span>
        </div>

        <h1 class="login-heading">Welcome Back</h1>
        <p class="subtitle">
            Enter your credentials to access the 10-Minute Decision System.
        </p>

        <!-- Supabase Account Notice -->
        <div class="demo-account-card">
            <div class="demo-card-header">
                <span class="demo-badge">SECURE SIGN-IN</span>
            </div>
            <div class="demo-creds-text">
                <div>Sign in with an account registered to this Supabase project.</div>
                <div class="demo-sub">Use your email address and project password. New users can create an account below.</div>
            </div>
        </div>

        <form id="loginForm" novalidate>

            <div class="form-group">
                <label for="email">Email address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        id="togglePassword"
                    >Show</button>
                </div>
            </div>

            <div class="options">
                <label class="remember">
                    <input type="checkbox" id="remember" checked>
                    Keep me signed in
                </label>
            </div>

            <button type="submit" class="login-button" id="loginBtn">
                SIGN IN
            </button>

            <div class="auth-divider" aria-hidden="true"><span>OR</span></div>

            <button type="button" class="google-login-button" id="googleLoginBtn">
                <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.89 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.91c-.58 2.96-2.26 5.48-4.73 7.18l7.27 5.64c4.25-3.92 6.7-9.7 6.7-17.29z"/>
                    <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.27-5.64c-2.02 1.35-4.6 2.15-8.63 2.15-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                Continue with Google
            </button>

            <p id="message" role="status" aria-live="polite"></p>

        </form>

        <p class="signup">
            Need an account?
            <a href="register.html">Create account</a>
        </p>

    </div>

</body>
</html>
